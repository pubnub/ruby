# Pre-existing offenses are recorded in .rubocop_todo.yml (generated with
# `rubocop --auto-gen-config --exclude-limit 1000`) so the lint gate can be
# enforced on new code without a large rewrite. Remove entries as they get fixed.
inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.0
  Exclude:
    - 'spec/**/*'
    - 'examples/**/*'
    - 'lib/pubnub/crypto.rb'
    - 'lib/pubnub/format.rb'


Metrics/ClassLength:
  Max: 150

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Max: 30

Metrics/MethodLength:
  Max: 35

Metrics/PerceivedComplexity:
  Max: 10

Metrics/CyclomaticComplexity:
  Enabled: false

