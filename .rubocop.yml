inherit_from: .rubocop_todo.yml

AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.0
  Exclude:
    - 'spec/**/*'
    - 'examples/**/*'
    - 'vendor/**/*'
    - 'lib/pubnub/crypto.rb'
    - 'lib/pubnub/format.rb'


Metrics/ClassLength:
  Max: 150

Layout/LineLength:
  Max: 150

Metrics/AbcSize:
  Max: 30

Metrics/MethodLength:
  Max: 35

Metrics/PerceivedComplexity:
  Max: 10

Metrics/CyclomaticComplexity:
  Enabled: false

